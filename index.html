<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#78b957">
<title>Blok Dünyası Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd2ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{display:block}button{font:inherit}#game,#hud{position:fixed;inset:0}#hud{pointer-events:none}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}.cross:before{width:18px;height:2px;top:8px}.cross:after{width:2px;height:18px;left:8px}.status{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0007;color:#fff;padding:7px 12px;border-radius:20px;font-size:13px;font-weight:800;white-space:nowrap}.hotbar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.slot{width:48px;height:48px;border:3px solid #ffffff88;border-radius:9px;background:#222b;display:grid;place-items:center}.slot.sel{border-color:#fff;transform:translateY(-5px)}.cube{width:27px;height:27px;border:2px solid #0003;box-shadow:inset -5px -5px #0002}.grass{background:linear-gradient(#65b74a 0 28%,#855334 28%)}.dirt{background:#855334}.stone{background:#7b7b7b}.wood{background:repeating-linear-gradient(90deg,#9a672f 0 5px,#71431f 5px 10px)}#joy{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:2px solid #fff5;background:#fff2;pointer-events:auto}#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#fffa;border:2px solid #fff;transform:translate(-50%,-50%)}#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}.actions{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:165px;height:145px}.act{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid #fff9;background:#222a;color:#fff;font-size:27px;font-weight:900;pointer-events:auto;text-shadow:0 2px 2px #000}.act:active{transform:scale(.9)}#break{right:0;bottom:0;background:#8d392fae}#place{left:25px;bottom:0}#jump{right:12px;top:0;background:#356da5b8}#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(#69aee6cc,#477f46dd)}.panel{width:min(430px,100%);padding:28px 23px;border:4px solid #ffffff99;border-radius:22px;background:#17271ee8;color:#fff;text-align:center;box-shadow:0 18px 55px #0007}.logo{width:62px;height:62px;margin:auto;background:linear-gradient(#66b54b 0 30%,#855334 30%);border:3px solid #0003;box-shadow:inset -9px -9px #0002}.panel h1{margin:10px 0 5px;font-size:clamp(34px,10vw,54px);line-height:.95}.panel p{color:#ffffffcf;line-height:1.45}#startBtn{border:0;border-bottom:5px solid #386b2b;border-radius:13px;padding:15px 24px 12px;background:#69b34c;color:#fff;font-size:20px;font-weight:900}.help{margin-top:16px;padding-top:14px;border-top:1px solid #ffffff2e;color:#ffffffb8;font-size:12px;line-height:1.5}#rotate{display:none;position:fixed;inset:0;z-index:30;place-items:center;text-align:center;padding:30px;background:#14231bea;color:#fff;font-size:21px;font-weight:900;pointer-events:none}@media(orientation:portrait) and (max-width:650px){body.started #rotate{display:grid}}@media(hover:hover) and (pointer:fine){#joy,#look,.actions{display:none}.hotbar{bottom:20px}}@media(max-height:430px){#joy{width:95px;height:95px}.actions{transform:scale(.84);transform-origin:bottom right}.slot{width:43px;height:43px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div class="cross"></div><div class="status" id="status">Dünya hazırlanıyor…</div>
<div class="hotbar">
<button class="slot sel" data-t="grass"><span class="cube grass"></span></button>
<button class="slot" data-t="dirt"><span class="cube dirt"></span></button>
<button class="slot" data-t="stone"><span class="cube stone"></span></button>
<button class="slot" data-t="wood"><span class="cube wood"></span></button>
</div>
<div id="joy"><div id="knob"></div></div><div id="look"></div>
<div class="actions"><button class="act" id="break">⛏</button><button class="act" id="place">＋</button><button class="act" id="jump">↑</button></div>
</div>
<div id="start"><div class="panel"><div class="logo"></div><h1>Blok Dünyası</h1><p>Telefonda yürüyebileceğin, blok kırıp yerleştirebileceğin küçük bir 3D dünya.</p><button id="startBtn">OYUNA BAŞLA</button><div class="help"><b>Telefon:</b> Soldaki çubukla yürü, sağ tarafta sürükleyerek bak.<br><b>Bilgisayar:</b> WASD, fare, boşluk; sol tık kırar, sağ tık koyar.</div></div></div>
<div id="rotate">Daha rahat oynamak için telefonu yatay çevir.</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),game=$('#game'),status=$('#status'),start=$('#start'),startBtn=$('#startBtn'),joy=$('#joy'),knob=$('#knob'),look=$('#look'),slots=[...document.querySelectorAll('.slot')];
if(!window.THREE){status.textContent='3D motoru yüklenemedi. İnterneti kontrol et.';startBtn.disabled=true;return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd2ff);scene.fog=new THREE.Fog(0x8fd2ff,16,40);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,80);cam.rotation.order='YXZ';
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.5));game.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xd9f3ff,0x53643d,1.1));const sun=new THREE.DirectionalLight(0xfff4d8,.85);sun.position.set(14,24,10);scene.add(sun);
const geo=new THREE.BoxGeometry(1,1,1),mats={grass:new THREE.MeshLambertMaterial({color:0x66a94b,flatShading:true}),dirt:new THREE.MeshLambertMaterial({color:0x805034,flatShading:true}),stone:new THREE.MeshLambertMaterial({color:0x777b7d,flatShading:true}),wood:new THREE.MeshLambertMaterial({color:0x8a5b2d,flatShading:true}),leaves:new THREE.MeshLambertMaterial({color:0x3c833c,flatShading:true}),sand:new THREE.MeshLambertMaterial({color:0xd6c27a,flatShading:true})};
const blocks=new Map(),meshes=[];const key=(x,y,z)=>`${x}|${y}|${z}`;
function add(x,y,z,t='dirt'){x=Math.round(x);y=Math.round(y);z=Math.round(z);if(blocks.has(key(x,y,z)))return;const q=new THREE.Mesh(geo,mats[t]||mats.dirt);q.position.set(x,y,z);q.userData={x,y,z,t};scene.add(q);blocks.set(key(x,y,z),q);meshes.push(q)}
function del(q){if(!q||q.userData.y<=-2)return;scene.remove(q);blocks.delete(key(q.userData.x,q.userData.y,q.userData.z));const i=meshes.indexOf(q);if(i>=0)meshes.splice(i,1)}
function height(x,z){return Math.floor(2.3+Math.sin(x*.38)*.75+Math.cos(z*.33)*.7+Math.sin((x+z)*.2)*.45)}
for(let x=-10;x<=10;x++)for(let z=-10;z<=10;z++){const h=height(x,z);for(let y=-2;y<=h;y++)add(x,y,z,y===h?(h<2?'sand':'grass'):y>h-3?'dirt':'stone')}
[[-6,-5],[6,-4],[7,6],[-7,7],[1,8],[-1,-8]].forEach(([x,z])=>{const y=height(x,z)+1;for(let i=0;i<3;i++)add(x,y+i,z,'wood');for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)add(x+dx,y+3,z+dz,'leaves');add(x,y+4,z,'leaves')});status.textContent='Çim bloğu seçili';
const p={x:0,y:height(0,0)+1,z:0,vy:0,yaw:0,pitch:-.1,ground:false},keys=new Set(),move={x:0,y:0};let chosen='grass',begun=false;
function floorAt(x,z){const X=Math.floor(x+.5),Z=Math.floor(z+.5);for(let y=15;y>=-2;y--)if(blocks.has(key(X,y,Z)))return y+.5;return-2.5}
function update(dt){let f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-move.y,s=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+move.x,l=Math.hypot(f,s);if(l>1){f/=l;s/=l}const si=Math.sin(p.yaw),co=Math.cos(p.yaw),dx=(s*co-f*si)*4.5*dt,dz=(-s*si-f*co)*4.5*dt;if(floorAt(p.x+dx,p.z)<=p.y+1.05)p.x+=dx;if(floorAt(p.x,p.z+dz)<=p.y+1.05)p.z+=dz;p.vy-=16*dt;p.y+=p.vy*dt;const g=floorAt(p.x,p.z)+.5;if(p.y<=g){p.y=g;p.vy=0;p.ground=true}else p.ground=false;if(p.y<-7){p.x=0;p.z=0;p.y=height(0,0)+1;p.vy=0}cam.position.set(p.x,p.y+1.55,p.z);cam.rotation.y=p.yaw;cam.rotation.x=p.pitch}
function jump(){if(p.ground){p.vy=6.2;p.ground=false}}
const ray=new THREE.Raycaster();ray.far=6;function hit(){ray.setFromCamera(new THREE.Vector2(0,0),cam);return ray.intersectObjects(meshes,false)[0]}
function breakBlock(){const h=hit();if(h){del(h.object);status.textContent='Blok kırıldı'}}
function placeBlock(){const h=hit();if(!h||!h.face)return;const v=h.object.position.clone().add(h.face.normal);if(Math.abs(v.x-p.x)<.7&&Math.abs(v.z-p.z)<.7&&v.y>p.y-.2&&v.y<p.y+2)return;add(v.x,v.y,v.z,chosen);status.textContent='Blok yerleştirildi'}
const names={grass:'Çim',dirt:'Toprak',stone:'Taş',wood:'Odun'};slots.forEach(s=>s.onpointerdown=e=>{e.preventDefault();chosen=s.dataset.t;slots.forEach(x=>x.classList.toggle('sel',x===s));status.textContent=names[chosen]+' bloğu seçili'});
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'){e.preventDefault();jump()}if(/^Digit[1-4]$/.test(e.code))slots[+e.code.at(-1)-1].dispatchEvent(new PointerEvent('pointerdown'))});addEventListener('keyup',e=>keys.delete(e.code));
function act(el,fn){el.onpointerdown=e=>{e.preventDefault();e.stopPropagation();fn();navigator.vibrate?.(15)}}act($('#break'),breakBlock);act($('#place'),placeBlock);act($('#jump'),jump);
let jp=null;function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.31;let x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;move.x=x/max;move.y=y/max}joy.onpointerdown=e=>{jp=e.pointerId;joy.setPointerCapture(jp);joyMove(e)};joy.onpointermove=e=>{if(e.pointerId===jp)joyMove(e)};function joyEnd(e){if(e.pointerId!==jp)return;jp=null;move.x=move.y=0;knob.style.transform='translate(-50%,-50%)'}joy.onpointerup=joy.onpointercancel=joyEnd;
let lp=null,lx=0,ly=0;look.onpointerdown=e=>{lp=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(lp)};look.onpointermove=e=>{if(e.pointerId!==lp)return;p.yaw-=(e.clientX-lx)*.006;p.pitch-=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY;p.pitch=Math.max(-1.46,Math.min(1.46,p.pitch))};look.onpointerup=look.onpointercancel=e=>{if(e.pointerId===lp)lp=null};
ren.domElement.onclick=()=>{if(begun&&matchMedia('(hover:hover) and (pointer:fine)').matches&&document.pointerLockElement!==ren.domElement)ren.domElement.requestPointerLock?.()};addEventListener('mousemove',e=>{if(document.pointerLockElement!==ren.domElement)return;p.yaw-=e.movementX*.0023;p.pitch=Math.max(-1.46,Math.min(1.46,p.pitch-e.movementY*.0023))});ren.domElement.onmousedown=e=>{if(document.pointerLockElement!==ren.domElement)return;e.button===0?breakBlock():e.button===2&&placeBlock()};ren.domElement.oncontextmenu=e=>e.preventDefault();
async function begin(e){e?.preventDefault();if(begun)return;begun=true;document.body.classList.add('started');start.style.display='none';try{await document.documentElement.requestFullscreen?.()}catch{}try{await screen.orientation?.lock?.('landscape')}catch{}}startBtn.addEventListener('pointerup',begin);startBtn.addEventListener('click',begin);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();move.x=move.y=0}});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.045);if(begun)update(dt);else{cam.position.set(8,9,12);cam.lookAt(0,2,0)}ren.render(scene,cam)}loop();
})();
</script>
</body>
</html>
